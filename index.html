<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>السكرتير الشخصي</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 90px; }
    header { padding: 24px 20px 16px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .header-title h1 { font-size: 1.3rem; font-weight: 700; color: var(--text); }
    .header-title p { font-size: 0.8rem; color: var(--text-muted); }
    .status-badge { background: #0369a1; color: #bae6fd; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
    
    .container { padding: 16px 20px; }
    .quick-voice-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 20px; text-align: center; }
    .mic-btn { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #38bdf8); border: none; color: white; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.35); transition: transform 0.2s; margin-bottom: 10px; }
    .mic-btn.listening { animation: pulse 1.2s infinite; background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .voice-hint { font-size: 0.85rem; color: var(--text-muted); }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #1e293b; padding: 4px; border-radius: 12px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #334155; color: var(--text); font-weight: 700; }

    .input-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .input-box input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 0.95rem; outline: none; }
    .input-box input:focus { border-color: var(--accent); }
    .add-btn { background: var(--accent); color: #0f172a; border: none; border-radius: 12px; padding: 0 18px; font-weight: 700; cursor: pointer; font-size: 1rem; }

    .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .item-card.completed .title-text { text-decoration: line-through; color: var(--text-muted); }
    .item-info { flex: 1; margin-right: 12px; }
    .item-info .title-text { font-size: 0.95rem; font-weight: 500; word-break: break-word; }
    .item-info .time-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .item-actions { display: flex; gap: 6px; }
    .action-btn { background: #334155; border: none; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer; }
    .action-btn.del { color: var(--danger); }
    .empty-msg { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1>السكرتير الشخصي</h1>
      <p id="todayDate">اليوم</p>
    </div>
    <span class="status-badge" id="storageStatus">محفوظ محلياً</span>
  </header>

  <div class="container">
    <div class="quick-voice-card">
      <button class="mic-btn" id="micBtn" onclick="toggleSpeech()">
        <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
      </button>
      <div class="voice-hint" id="voiceStatus">اضغط للتحدث وإملاء مهمة أو خاطرة</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabTasks" onclick="switchTab('tasks')">المهام والمواعيد</button>
      <button class="tab-btn" id="tabNotes" onclick="switchTab('notes')">المذكرات والخواطر</button>
    </div>

    <div class="input-box">
      <input type="text" id="manualInput" placeholder="أدخل بياناً جديداً..." onkeypress="handleEnter(event)">
      <button class="add-btn" onclick="addManualItem()">إضافة</button>
    </div>

    <div id="itemsList"></div>
  </div>

  <script>
    let activeTab = 'tasks';
    let tasks = JSON.parse(localStorage.getItem('my_tasks') || '[]');
    let notes = JSON.parse(localStorage.getItem('my_notes') || '[]');

    document.getElementById('todayDate').innerText = new Date().toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    function render() {
      const list = document.getElementById('itemsList');
      const items = activeTab === 'tasks' ? tasks : notes;
      list.innerHTML = '';

      if (items.length === 0) {
        list.innerHTML = `<div class="empty-msg">لا توجد عناصر مسجلة حالياً</div>`;
        return;
      }

      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `item-card ${item.done ? 'completed' : ''}`;
        div.innerHTML = `
          <div class="item-info">
            <div class="title-text">${item.text}</div>
            <div class="time-text">${item.date}</div>
          </div>
          <div class="item-actions">
            ${activeTab === 'tasks' ? `
              <button class="action-btn" onclick="toggleTask(${index})">
                ${item.done ? '✓' : '○'}
              </button>` : ''}
            <button class="action-btn del" onclick="deleteItem(${index})">✕</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabTasks').className = `tab-btn ${tab === 'tasks' ? 'active' : ''}`;
      document.getElementById('tabNotes').className = `tab-btn ${tab === 'notes' ? 'active' : ''}`;
      render();
    }

    function addManualItem() {
      const input = document.getElementById('manualInput');
      const text = input.value.trim();
      if (!text) return;
      saveEntry(text);
      input.value = '';
    }

    function handleEnter(e) { if (e.key === 'Enter') addManualItem(); }

    function saveEntry(text) {
      const now = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
      if (activeTab === 'tasks') {
        tasks.unshift({ text, date: now, done: false });
        localStorage.setItem('my_tasks', JSON.stringify(tasks));
      } else {
        notes.unshift({ text, date: now });
        localStorage.setItem('my_notes', JSON.stringify(notes));
      }
      render();
    }

    function toggleTask(i) {
      tasks[i].done = !tasks[i].done;
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      render();
    }

    function deleteItem(i) {
      if (activeTab === 'tasks') {
        tasks.splice(i, 1);
        localStorage.setItem('my_tasks', JSON.stringify(tasks));
      } else {
        notes.splice(i, 1);
        localStorage.setItem('my_notes', JSON.stringify(notes));
      }
      render();
    }

    let recognition = null;
    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function toggleSpeech() {
      if (!SpeechRecognition) {
        alert('ميزة التحدث الصوتي غير مدعومة في هذا المتصفح، يرجى الفتح عبر Chrome.');
        return;
      }
      if (isListening) {
        recognition.stop();
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('voiceStatus').innerText = 'جارٍ الاستماع... تحدث الآن';
      };

      recognition.onresult = (e) => {
        const spokenText = e.results[0][0].transcript;
        saveEntry(spokenText);
        document.getElementById('voiceStatus').innerText = 'تم التدوين بنجاح!';
      };

      recognition.onerror = () => {
        document.getElementById('voiceStatus').innerText = 'تعذر التقاط الصوت، أعد المحاولة';
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        setTimeout(() => {
          document.getElementById('voiceStatus').innerText = 'اضغط للتحدث وإملاء مهمة أو خاطرة';
        }, 2000);
      };

      recognition.start();
    }

    render();
  </script>
</body>
</html>
